<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" style="background:#07090f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c162d" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="460" rx="16" fill="url(#bgGlow)" stroke="#1a2238" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">NATIONAL FAMILY HEALTH SURVEY (NFHS-5)</text>
    <text x="0" y="26" fill="#ffffff" font-size="20" font-weight="700">Are Indians Predominantly Vegetarian?</text>
    <text x="0" y="46" fill="#64748b" font-size="12">Self-reported dietary habits across gender &amp; states (Sample size: 700,000+ respondents)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 42)">
    <!-- Non-Veg item -->
    <rect x="0" y="0" width="12" height="12" rx="3" fill="url(#blueGrad)" />
    <text x="18" y="10" fill="#e2e8f0" font-size="11" font-weight="600">Non-Veg (71%)</text>
    
    <!-- Veg item -->
    <rect x="120" y="0" width="12" height="12" rx="3" fill="url(#roseGrad)" />
    <text x="138" y="10" fill="#e2e8f0" font-size="11" font-weight="600">Vegetarian (29%)</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="110" x2="764" y2="110" stroke="#161e31" stroke-width="1" />

  <!-- Regional Comparison Bars -->
  <!-- 1. Eastern India -->
  <g transform="translate(36, 140)">
    <text x="0" y="12" fill="#f1f5f9" font-size="13" font-weight="600">Eastern &amp; North-East</text>
    <text x="0" y="28" fill="#64748b" font-size="11">WB, Assam, Odisha, Tripura</text>
    
    <!-- Bar Container (Width 480px, starts at x=200) -->
    <g transform="translate(200, 2)">
      <!-- Non-Veg 98% = 470px -->
      <rect x="0" y="0" width="470" height="24" rx="4" fill="url(#blueGrad)" />
      <!-- Veg 2% = 10px -->
      <rect x="470" y="0" width="10" height="24" rx="4" fill="url(#roseGrad)" />
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="700">98% Non-Veg</text>
      <text x="490" y="16" fill="#fb7185" font-size="11" font-weight="700">2%</text>
    </g>
  </g>

  <!-- 2. Southern India -->
  <g transform="translate(36, 205)">
    <text x="0" y="12" fill="#f1f5f9" font-size="13" font-weight="600">Southern States</text>
    <text x="0" y="28" fill="#64748b" font-size="11">Kerala, Telangana, AP, Tamil Nadu</text>
    
    <g transform="translate(200, 2)">
      <!-- Non-Veg 96% = 460px -->
      <rect x="0" y="0" width="460" height="24" rx="4" fill="url(#blueGrad)" />
      <!-- Veg 4% = 20px -->
      <rect x="460" y="0" width="20" height="24" rx="4" fill="url(#roseGrad)" />
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="700">96% Non-Veg</text>
      <text x="490" y="16" fill="#fb7185" font-size="11" font-weight="700">4%</text>
    </g>
  </g>

  <!-- 3. Western India -->
  <g transform="translate(36, 270)">
    <text x="0" y="12" fill="#f1f5f9" font-size="13" font-weight="600">Western States</text>
    <text x="0" y="28" fill="#64748b" font-size="11">Maharashtra, Goa, Gujarat</text>
    
    <g transform="translate(200, 2)">
      <!-- Non-Veg 68% = 326px -->
      <rect x="0" y="0" width="326" height="24" rx="4" fill="url(#blueGrad)" />
      <!-- Veg 32% = 154px -->
      <rect x="326" y="0" width="154" height="24" rx="4" fill="url(#roseGrad)" />
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="700">68% Non-Veg</text>
      <text x="440" y="16" fill="#ffffff" font-size="11" font-weight="700">32%</text>
    </g>
  </g>

  <!-- 4. Northern & Central India -->
  <g transform="translate(36, 335)">
    <text x="0" y="12" fill="#f1f5f9" font-size="13" font-weight="600">Northern &amp; Central</text>
    <text x="0" y="28" fill="#64748b" font-size="11">Rajasthan, Haryana, Punjab, MP</text>
    
    <g transform="translate(200, 2)">
      <!-- Non-Veg 43% = 206px -->
      <rect x="0" y="0" width="206" height="24" rx="4" fill="url(#blueGrad)" />
      <!-- Veg 57% = 274px -->
      <rect x="206" y="0" width="274" height="24" rx="4" fill="url(#roseGrad)" />
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="700">43% Non-Veg</text>
      <text x="340" y="16" fill="#ffffff" font-size="11" font-weight="700">57% Vegetarian</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(36, 420)">
    <text x="0" y="0" fill="#475569" font-size="11">Data: NFHS-5 official report &amp; Pew Research India Religion Survey. Shows adults who consume meat/poultry/fish/eggs at least occasionally.</text>
  </g>
</svg>
