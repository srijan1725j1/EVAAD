<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Squircle Background (Clean Warm White Tile like the user's reference image) -->
    <linearGradient id="appBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Seamless Poll-Bar Gradient across the Two-Headed Arrow -->
    <linearGradient id="poleArrowGrad" x1="36" y1="305" x2="476" y2="305" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="32%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="68%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Center Eye Iris (Teal/Cyan as in reference) -->
    <radialGradient id="centerIrisGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="65%" stop-color="#45b1a8" />
      <stop offset="100%" stop-color="#0d9488" />
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#e2e8f0" stroke-width="6" fill="none" />

  <!-- 1. UPPER SEMICIRCULAR ARCH (Eyelid Band resting on the arrow shaft) -->
  <path
    d="M 106 276 A 150 150 0 0 1 406 276 L 362 276 A 106 106 0 0 0 150 276 Z"
    fill="#f5f2dc"
    stroke="#2c353d"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- 2. CENTRAL EYE IRIS & PUPIL -->
  <circle
    cx="256"
    cy="218"
    r="66"
    fill="url(#centerIrisGrad)"
    stroke="#2c353d"
    stroke-width="12"
  />
  <circle
    cx="256"
    cy="218"
    r="26"
    fill="#263238"
  />
  <circle
    cx="269"
    cy="205"
    r="8"
    fill="#ffffff"
    opacity="0.92"
  />

  <!-- 3. STRAIGHT TWO-HEADED HORIZONTAL ARROW WITH SEAMLESS POLL GRADIENT -->
  <path
    d="M 36 305 L 132 228 L 132 276 L 380 276 L 380 228 L 476 305 L 380 382 L 380 334 L 132 334 L 132 382 Z"
    fill="url(#poleArrowGrad)"
    stroke="#2c353d"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Center Join Line where the 2 opposing arrows meet -->
  <line
    x1="256"
    y1="276"
    x2="256"
    y2="334"
    stroke="#2c353d"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Brand Wordmark at bottom of app icon -->
  <text
    x="256"
    y="448"
    text-anchor="middle"
    fill="#2c353d"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="68"
    letter-spacing="-1"
  >evaad</text>
</svg>